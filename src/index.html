<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.webgpu.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
        }
      }
    </script>
    <script type ="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { MMDLoader } from 'three/addons/loaders/MMDLoader.js';
      import { MMDAnimationHelper } from 'three/addons/animation/MMDAnimationHelper.js';

      const width = 960;
      const height = 540;
      const canvas = document.querySelector('#myCanvas');

      const loadingManager = new THREE.LoadingManager();
      loadingManager.setURLModifier((url) => {
        let normalized = url.replace(/\\/g, '/').replace(/%5C/gi, '/');
        normalized = normalized.replace('/texture/texture/', '/texture/');
        return normalized;
      });
      loadingManager.onError = (url) => {
        console.error('Failed to load resource:', url);
      };

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x000000, 50, 3000);

      const bgTexture = new THREE.TextureLoader(loadingManager).load('../picture/sky.jpg');
      bgTexture.colorSpace = THREE.SRGBColorSpace;
      scene.background = bgTexture;

      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 5000);
      camera.position.set(0, 200, 1200);

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 200, 0);
      controls.update();

      // 平行光源を作成
      // // new THREE.DirectionalLight(色, 光の強さ)
      const light = new THREE.DirectionalLight(0xFFFFFF, 1);
      scene.add(light);


      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight);

      const mmdHelper = new MMDAnimationHelper({
        afterglow: 2.0,
        physics: false,
      });

      const loader = new MMDLoader(loadingManager);
      loader.setResourcePath('../mmd/紅魔館/');
      loader.load(
        '../mmd/紅魔館/紅魔館.pmx',
        (mesh) => {
          scene.add(mesh);
          mmdHelper.add(mesh, {
            physics: false,
          });
        },
        undefined,
        (error) => {
          console.error('PMX load error:', error);
        }
      );

      const clock = new THREE.Clock();

      function tick() {
        const delta = clock.getDelta();
        mmdHelper.update(delta);
        renderer.render(scene, camera);
      }

      renderer.setAnimationLoop(tick);
    </script>
    </head>
  <body>
    <canvas id="myCanvas"></canvas>
  </body>
</html>
